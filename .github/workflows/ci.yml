# GitHub Actions: run the test suite on every push and pull request.
#
# Triggered on:
#   - pushes to any branch
#   - PRs targeting master
# Runs on:
#   - Ubuntu (Linux) — fast, free, and matches Render's deployment OS
# Matrix:
#   - Python 3.12 and 3.13. We don't test 3.14 yet because some packages
#     occasionally lag a release; 3.12/3.13 is what most users will run.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false       # don't cancel 3.13 just because 3.12 failed
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip          # cache wheels between runs => much faster

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: pytest --cov-report=xml --cov-report=term

      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore